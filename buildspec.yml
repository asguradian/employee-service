version: 0.2

env:
  variables:
    AWS_DEFAULT_REGION: "us-east-1"
    IMAGE_REPO_NAME: "asgard"

phases:
  pre_build:
    commands:
      - "echo Starting build..."
      - "COMMIT_HASH=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)"
      - "IMAGE_TAG=$COMMIT_HASH"
      - "echo Image tag: $IMAGE_TAG"

      - |
        if [ -z "$CODEBUILD_WEBHOOK_TRIGGER" ]; then
          echo "CodePipeline build detected - ECR publishing ENABLED"

          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          ECR_URI=$ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com

          echo "Logging in to Amazon ECR..."
          aws ecr get-login-password --region $AWS_DEFAULT_REGION | \
            docker login --username AWS --password-stdin $ECR_URI

          echo "ECR URI: $ECR_URI"
        else
          echo "Webhook build detected: $CODEBUILD_WEBHOOK_TRIGGER"
          echo "Branch/PR build - ECR publishing DISABLED"
        fi

  build:
    commands:
      - "echo Building Docker image..."
      - "docker build -t $IMAGE_REPO_NAME:$IMAGE_TAG ."

  post_build:
    commands:
      - |
        if [ -z "$CODEBUILD_WEBHOOK_TRIGGER" ]; then
          echo "Publishing Docker image to ECR..."

          docker tag \
            $IMAGE_REPO_NAME:$IMAGE_TAG \
            $ECR_URI/$IMAGE_REPO_NAME:$IMAGE_TAG

          docker push \
            $ECR_URI/$IMAGE_REPO_NAME:$IMAGE_TAG

          echo "Image published: $ECR_URI/$IMAGE_REPO_NAME:$IMAGE_TAG"
        else
          echo "Webhook build - skipping ECR publish"
          echo "Build completed successfully"
        fi