spring:
  application:
    name: employee-service
  datasource:
    url: jdbc:h2:mem:employeedb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create
    open-in-view: false
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  file:
    name: ${LOG_FILE:logs/employee-service.log}
  level:
    org.hibernate.SQL: warn

# The H2 database is intentionally in-memory and ephemeral.
# All data is lost when the application stops.
